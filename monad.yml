x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: "3"
      tag: '{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}'

services:
  monad:
    build:
      context: ./monad
      dockerfile: Dockerfile.source
      args:
        MONAD_VERSION: ${MONAD_VERSION:-}
    image: monad:local
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 5m
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    environment:
      NETWORK: ${NETWORK:-mainnet}
      NODE_ROLE: ${NODE_ROLE:-fullnode}
      NODE_NAME: ${NODE_NAME:-full_monad_docker}
      BENEFICIARY_ADDRESS: ${BENEFICIARY_ADDRESS:-0x0000000000000000000000000000000000000000}
      CONSENSUS_PORT: ${CONSENSUS_PORT:-8000}
      AUTH_PORT: ${AUTH_PORT:-8001}
      RPC_PORT: ${RPC_PORT:-8080}
      WS_PORT: ${WS_PORT:-8081}
      METRICS_PORT: ${METRICS_PORT:-8889}
      PUBLIC_IP: ${PUBLIC_IP:-}
      SELF_RECORD_SEQ_NUM: ${SELF_RECORD_SEQ_NUM:-1}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-}
      SNAPSHOT: ${SNAPSHOT:-}
      REMOTE_VALIDATORS_URL: ${REMOTE_VALIDATORS_URL:-}
      REMOTE_FORKPOINT_URL: ${REMOTE_FORKPOINT_URL:-}
      ENABLE_TRACE_CALLS: ${ENABLE_TRACE_CALLS:-true}
      ENABLE_WEBSOCKETS: "${ENABLE_WEBSOCKETS:-false}"
      EXECUTION_EXTRA_FLAGS: ${EXECUTION_EXTRA_FLAGS:-}
      RPC_EXTRA_FLAGS: ${RPC_EXTRA_FLAGS:-}
      RETENTION_LEDGER: ${RETENTION_LEDGER:-600}
      RETENTION_WAL: ${RETENTION_WAL:-300}
      RETENTION_FORKPOINT: ${RETENTION_FORKPOINT:-300}
      RETENTION_VALIDATORS: ${RETENTION_VALIDATORS:-43200}
      MONGO_URL: ${MONGO_URL:-}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-archive-db}
      ARCHIVE_API_KEY: ${ARCHIVE_API_KEY:-}
      ARCHIVE_BUCKET: ${ARCHIVE_BUCKET:-}
      ARCHIVE_URL: ${ARCHIVE_URL:-https://9df09fanz1.execute-api.us-east-2.amazonaws.com/prod}
      ARCHIVE_REGION: ${ARCHIVE_REGION:-us-east-2}
    ports:
      - ${CONSENSUS_PORT:-8000}:${CONSENSUS_PORT:-8000}/tcp
      - ${CONSENSUS_PORT:-8000}:${CONSENSUS_PORT:-8000}/udp
      - ${AUTH_PORT:-8001}:${AUTH_PORT:-8001}/udp
    volumes:
      - monad-bft-data:/home/monad/monad-bft
      - monad-backup:/opt/monad/backup
      - triedb-data:/triedb
    labels:
      - metrics.scrape=true
      - metrics.path=/metrics
      - metrics.port=${METRICS_PORT:-8889}
      - metrics.instance=monad
      - metrics.network=${NETWORK:-mainnet}
      - traefik.enable=true
      - traefik.http.routers.${RPC_HOST}.service=${RPC_HOST}
      - traefik.http.routers.${RPC_HOST}.entrypoints=websecure
      - traefik.http.routers.${RPC_HOST}.rule=Host(`${RPC_HOST}.${DOMAIN}`)
      - traefik.http.routers.${RPC_HOST}.tls.certresolver=letsencrypt
      - traefik.http.routers.${RPC_HOST}lb.service=${RPC_HOST}
      - traefik.http.routers.${RPC_HOST}lb.entrypoints=websecure
      - traefik.http.routers.${RPC_HOST}lb.rule=Host(`${RPC_LB}.${DOMAIN}`)
      - traefik.http.routers.${RPC_HOST}lb.tls.certresolver=letsencrypt
      - traefik.http.services.${RPC_HOST}.loadbalancer.server.port=${RPC_PORT:-8080}
      - traefik.http.routers.${WS_HOST:-monadws}.service=${WS_HOST:-monadws}
      - traefik.http.routers.${WS_HOST:-monadws}.entrypoints=websecure
      - traefik.http.routers.${WS_HOST:-monadws}.rule=Host(`${WS_HOST:-monadws}.${DOMAIN}`)
      - traefik.http.routers.${WS_HOST:-monadws}.tls.certresolver=letsencrypt
      - traefik.http.routers.${WS_HOST:-monadws}lb.service=${WS_HOST:-monadws}
      - traefik.http.routers.${WS_HOST:-monadws}lb.entrypoints=websecure
      - traefik.http.routers.${WS_HOST:-monadws}lb.rule=Host(`${WS_LB:-monadws-lb}.${DOMAIN}`)
      - traefik.http.routers.${WS_HOST:-monadws}lb.tls.certresolver=letsencrypt
      - traefik.http.services.${WS_HOST:-monadws}.loadbalancer.server.port=${WS_PORT:-8081}
    <<: *logging

  cli:
    profiles: ["tools"]
    build:
      context: ./monad
      dockerfile: Dockerfile.source
      args:
        MONAD_VERSION: ${MONAD_VERSION:-}
    image: monad:local
    pull_policy: never
    entrypoint: ["/bin/bash"]
    environment:
      NETWORK: ${NETWORK:-mainnet}
      NODE_ROLE: ${NODE_ROLE:-fullnode}
    volumes:
      - monad-bft-data:/home/monad/monad-bft
      - monad-backup:/opt/monad/backup
      - triedb-data:/triedb

volumes:
  monad-bft-data:
  monad-backup:
  triedb-data:
