[supervisord]
nodaemon=true
user=monad
logfile=/var/log/monad/supervisord.log
pidfile=/var/log/monad/supervisord.pid

[program:monad-bft]
command=/bin/bash -lc 'exec /usr/bin/monad-bft'
directory=/home/monad
autostart=true
autorestart=true
startsecs=10
stderr_logfile=/var/log/monad/monad-bft-stderr.log
stdout_logfile=/var/log/monad/monad-bft-stdout.log
stopwaitsecs=300
stopsignal=TERM

[program:monad-execution]
command=/bin/bash -lc 'exec /usr/bin/monad-execution ${EXECUTION_EXTRA_FLAGS:-}'
directory=/home/monad
autostart=true
autorestart=true
startsecs=10
stderr_logfile=/var/log/monad/monad-execution-stderr.log
stdout_logfile=/var/log/monad/monad-execution-stdout.log
stopwaitsecs=300
stopsignal=TERM
environment=EXECUTION_EXTRA_FLAGS="%(ENV_EXECUTION_EXTRA_FLAGS)s"

[program:monad-rpc]
command=/bin/bash -lc 'exec /usr/bin/monad-rpc ${RPC_EXTRA_FLAGS:-}'
directory=/home/monad
autostart=true
autorestart=true
startsecs=10
stderr_logfile=/var/log/monad/monad-rpc-stderr.log
stdout_logfile=/var/log/monad/monad-rpc-stdout.log
stopwaitsecs=300
stopsignal=TERM
environment=RPC_EXTRA_FLAGS="%(ENV_RPC_EXTRA_FLAGS)s"
