[supervisord]
nodaemon=true
user=monad
logfile=/var/log/monad/supervisord.log
pidfile=/var/log/monad/supervisord.pid

[program:monad-bft]
command=/bin/bash -lc 'exec /usr/local/bin/monad-node \
  --secp-identity /home/monad/monad-bft/config/id-secp \
  --bls-identity /home/monad/monad-bft/config/id-bls \
  --node-config /home/monad/monad-bft/config/node.toml \
  --forkpoint-config /home/monad/monad-bft/config/forkpoint/forkpoint.toml \
  --wal-path /home/monad/monad-bft/wal \
  --mempool-ipc-path /home/monad/monad-bft/mempool.sock \
  --control-panel-ipc-path /home/monad/monad-bft/controlpanel.sock \
  --statesync-ipc-path /home/monad/monad-bft/statesync.sock \
  --ledger-path /home/monad/monad-bft/ledger \
  --triedb-path /triedb \
  --otel-endpoint http://127.0.0.1:4317 \
  --record-metrics-interval-seconds 1 \
  --validators-path /home/monad/monad-bft/config/validators/validators.toml \
  --persisted-peers-path /home/monad/monad-bft/config/peers.toml \
  --keystore-password "${KEYSTORE_PASSWORD}"'
directory=/home/monad
autostart=true
autorestart=true
startsecs=10
stderr_logfile=/var/log/monad/monad-bft-stderr.log
stdout_logfile=/var/log/monad/monad-bft-stdout.log
stopwaitsecs=300
stopsignal=TERM
environment=KEYSTORE_PASSWORD="%(ENV_KEYSTORE_PASSWORD)s"

[program:monad-execution]
command=/bin/bash -lc 'exec /usr/local/bin/monad \
  --chain "${CHAIN}" \
  --db /triedb \
  --block_db /home/monad/monad-bft/ledger \
  --statesync /home/monad/monad-bft/statesync.sock \
  --sq_thread_cpu 1 \
  --log_level INFO \
  ${EXECUTION_EXTRA_FLAGS:-}'
directory=/home/monad
autostart=true
autorestart=true
startsecs=10
stderr_logfile=/var/log/monad/monad-execution-stderr.log
stdout_logfile=/var/log/monad/monad-execution-stdout.log
stopwaitsecs=300
stopsignal=TERM
environment=CHAIN="%(ENV_CHAIN)s",EXECUTION_EXTRA_FLAGS="%(ENV_EXECUTION_EXTRA_FLAGS)s"

[program:monad-rpc]
command=/bin/bash -lc 'exec /usr/local/bin/monad-rpc \
  --ipc-path /home/monad/monad-bft/mempool.sock \
  --triedb-path /triedb \
  --otel-endpoint http://127.0.0.1:4317 \
  --allow-unprotected-txs \
  --node-config /home/monad/monad-bft/config/node.toml \
  ${RPC_EXTRA_FLAGS:-}'
directory=/home/monad
autostart=true
autorestart=true
startsecs=10
stderr_logfile=/var/log/monad/monad-rpc-stderr.log
stdout_logfile=/var/log/monad/monad-rpc-stdout.log
stopwaitsecs=300
stopsignal=TERM
environment=RPC_EXTRA_FLAGS="%(ENV_RPC_EXTRA_FLAGS)s"